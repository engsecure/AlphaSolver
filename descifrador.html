<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaSolver - Descifrador</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="nav">
        <a href="index.html" class="logo">Alpha<span>Solver</span></a>
        <div class="secciones-left">
            <a href="index.html">Inicio</a>
            <a href="descifrador.html" class="active">Descifrador</a>
        </div>
    </nav>

    <main class="contenedor-decifrador">
        <nav class="nav-metodos">
            <button id="btn-auto" class="metodo-btn activo" onclick="cambiarMetodo('auto')">Detección Automática</button>
            <button id="btn-atbash" class="metodo-btn" onclick="cambiarMetodo('atbash')">Método Atbash</button>
            <button id="btn-cesar" class="metodo-btn" onclick="cambiarMetodo('cesar')">Método César</button>
        </nav>
        
        <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px;">
   
            <div class="configuracion-metodo">
                <label for="alfabeto">Alfabeto / Símbolos:</label>
                <input type="text" id="alfabeto" value="abcdefghijklmnopqrstuvwxyz" style="width: 250px;">
            </div>

            <div id="config-cesar" class="configuracion-metodo oculto">
                <label for="desplazamiento">Desplazamiento (Shift):</label>
                <input type="number" id="desplazamiento" min="1" max="99" value="3">
            </div>
        </div>

        <div class="bloque-contenedor-input">
            <div class="caja-texto">
                <label for="texto-origen">Texto Original / Entrada</label>
                <textarea id="texto-origen" placeholder="Escribe o pega tu texto aquí..." spellcheck="false"></textarea>
            </div>

            <div class="caja-texto">
                <label for="texto-descifrado">Texto Descifrado</label>
                <textarea id="texto-descifrado" placeholder="El texto descifrado aparecerá aquí..." readonly spellcheck="false"></textarea>
            </div>

            <div class="caja-texto">
                <label for="texto-cifrado">Texto Cifrado</label>
                <textarea id="texto-cifrado" placeholder="El texto cifrado aparecerá aquí..." readonly spellcheck="false"></textarea>
            </div>
        </div>
    </main>

    <script src="js/atbash.js"></script>
    <script src="js/cesar.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
